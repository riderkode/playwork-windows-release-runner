name: prove-public-windows-install

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-and-prove:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Install from the public Playwork channel
        run: |
          $ErrorActionPreference = "Stop"
          $install = Join-Path $env:RUNNER_TEMP "playwork-public-install"
          $installer = Join-Path $env:RUNNER_TEMP "install.ps1"
          Invoke-WebRequest -UseBasicParsing -Uri "https://playwork.sh/download/latest/install.ps1" -OutFile $installer
          $env:PLAYWORK_INSTALL_DIR = $install
          $env:PLAYWORK_ADD_TO_PATH = "0"
          & $installer
          if ($LASTEXITCODE -ne 0) { throw "Public installer failed: $LASTEXITCODE" }

          $version = & (Join-Path $install "playwork.cmd") --version
          if ($LASTEXITCODE -ne 0 -or $version.Trim() -ne "0.0.15") { throw "Version proof failed: $version" }
          $help = (& (Join-Path $install "playwork.cmd") --help) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "Help proof failed: $LASTEXITCODE" }
          if ($help -notmatch "playwork auth login" -or $help -notmatch "/export \[path\]") { throw "Customer help contract missing" }
          if ($help -match "/share|/login|--provider|--api-key|codex|openai|hosted|runtime profile") { throw "Customer help exposes forbidden implementation language" }

          $report = Get-Content (Join-Path $install "BINARY-STAGING-REPORT.json") -Raw | ConvertFrom-Json
          if ($report.profile -ne "customer-playwork-account" -or $report.runtimeProfile -ne "playwork-hosted" -or $report.appAttach -ne "auto") {
            throw "Installed profile contract failed"
          }
          $bash = Join-Path $install "git/usr/bin/bash.exe"
          if (-not (Test-Path $bash)) { throw "Bundled Git Bash is missing" }
          "PUBLIC_INSTALL_PASS version=$version profile=$($report.profile) runtimeProfile=$($report.runtimeProfile) appAttach=$($report.appAttach) bash=$bash"
