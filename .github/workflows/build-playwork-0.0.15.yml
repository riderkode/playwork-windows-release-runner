name: build-playwork-windows-0.0.15

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-prove:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"

      - name: Check out exact private source
        env:
          PLAYWORK_SOURCE_DEPLOY_KEY_B64: ${{ secrets.PLAYWORK_SOURCE_DEPLOY_KEY_B64 }}
        run: |
          $ErrorActionPreference = "Stop"
          $ssh = Join-Path $env:RUNNER_TEMP "playwork-source-ssh"
          New-Item -ItemType Directory -Force -Path $ssh | Out-Null
          $key = Join-Path $ssh "id_ed25519"
          $knownHosts = Join-Path $ssh "known_hosts"
          [System.IO.File]::WriteAllBytes($key, [Convert]::FromBase64String($env:PLAYWORK_SOURCE_DEPLOY_KEY_B64))
          $meta = Invoke-RestMethod -Uri "https://api.github.com/meta"
          $meta.ssh_keys | ForEach-Object { "github.com $_" } | Set-Content -Path $knownHosts
          $env:GIT_SSH_COMMAND = "ssh -i `"$key`" -o IdentitiesOnly=yes -o UserKnownHostsFile=`"$knownHosts`""
          git clone --filter=blob:none git@github.com:riderkode/playwork-main.git source
          git -C source checkout --detach 88f55d1e227f72b83773c8c4e807808e7c51c6b6
          $actual = git -C source rev-parse HEAD
          if ($actual -ne "88f55d1e227f72b83773c8c4e807808e7c51c6b6") { throw "Wrong source SHA: $actual" }

      - name: Install workspace dependencies
        working-directory: source/runtime/playwork
        run: npm ci --ignore-scripts

      - name: Build exact standalone package
        working-directory: source/runtime/playwork
        run: npm run build:package -- --platform windows-x64 --app-attach auto

      - name: Use the reviewed post-tag Windows proof harness
        working-directory: source
        run: |
          $ErrorActionPreference = "Stop"
          $proofCommit = "885b678713cc6528f36da069425c6ffb0ed8dd43"
          $proofPath = "runtime/playwork/scripts/proof/runtime-functional-smoke.mjs"
          $proof = git show "${proofCommit}:${proofPath}"
          if ($LASTEXITCODE -ne 0) { throw "Could not read reviewed proof harness at $proofCommit" }
          $proof | Set-Content -Path $proofPath -Encoding utf8NoBOM
          git diff --exit-code $proofCommit -- $proofPath
          if ($LASTEXITCODE -ne 0) { throw "Installed proof harness differs from $proofCommit" }

      - name: Isolate the Windows proof environment hang
        working-directory: source/runtime/playwork
        run: |
          $ErrorActionPreference = "Stop"
          $artifact = (Resolve-Path "packages/computer-agent/binaries/windows-x64").Path
          $node = Join-Path $artifact "node/node.exe"
          $cli = Join-Path $artifact "dist/cli.js"
          $root = Join-Path $env:RUNNER_TEMP "playwork-proof-env-diagnostic"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $deny = Join-Path $root "deny-network.cjs"
          @'
          const deny = () => { throw new Error("PLAYWORK_PROOF_NETWORK_DENIED"); };
          const net = require("node:net");
          const tls = require("node:tls");
          const http = require("node:http");
          const https = require("node:https");
          net.Socket.prototype.connect = deny;
          net.connect = deny;
          net.createConnection = deny;
          tls.connect = deny;
          http.request = deny;
          http.get = deny;
          https.request = deny;
          https.get = deny;
          globalThis.fetch = deny;
          '@ | Set-Content -Path $deny -Encoding utf8NoBOM
          function Invoke-Proof([string]$label, [bool]$denyNetwork) {
            $home = Join-Path $root $label
            New-Item -ItemType Directory -Force -Path $home | Out-Null
            $env:HOME = $home
            $env:USERPROFILE = $home
            $env:APPDATA = Join-Path $home "AppData/Roaming"
            $env:LOCALAPPDATA = Join-Path $home "AppData/Local"
            $env:PLAYWORK_PRODUCT_PROOF = "hosted-headless"
            $env:PLAYWORK_COMPUTER_AGENT_DIR = Join-Path $home "agent"
            $env:PLAYWORK_OFFLINE = "1"
            $env:PLAYWORK_SKIP_VERSION_CHECK = "1"
            if ($denyNetwork) { $env:NODE_OPTIONS = "--require=$deny" } else { Remove-Item Env:NODE_OPTIONS -ErrorAction SilentlyContinue }
            $stdout = Join-Path $root "$label.stdout.log"
            $stderr = Join-Path $root "$label.stderr.log"
            $process = Start-Process -FilePath $node -ArgumentList @($cli) -WorkingDirectory $artifact -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
            if (-not $process.WaitForExit(30000)) {
              taskkill /PID $process.Id /T /F | Out-Host
              "$label TIMEOUT"
            } else {
              "$label EXIT=$($process.ExitCode)"
            }
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
          }
          Invoke-Proof "isolated-without-network-deny" $false
          Invoke-Proof "isolated-with-network-deny" $true
          Remove-Item Env:PLAYWORK_PRODUCT_PROOF,Env:NODE_OPTIONS -ErrorAction SilentlyContinue

      - name: Run functional smoke
        working-directory: source/runtime/playwork
        run: |
          node scripts/proof/runtime-functional-smoke.mjs --artifact-dir packages/computer-agent/binaries/windows-x64 --platform windows-x64 | Tee-Object runtime-functional-smoke-windows-x64.json
          if ($LASTEXITCODE -ne 0) { throw "Functional smoke failed: $LASTEXITCODE" }

      - name: Install release zipper
        run: choco install zip -y --no-progress

      - name: Package shared release channel
        working-directory: source/runtime/playwork
        run: npm run package:windows-release -- --base-url https://playwork.sh/download/latest --app-attach auto

      - name: Install packaged release into a fresh directory
        working-directory: source/runtime/playwork
        run: |
          $ErrorActionPreference = "Stop"
          $release = (Resolve-Path "packages/computer-agent/binaries/windows-x64-release").Path
          $install = Join-Path $env:RUNNER_TEMP "playwork-public-install-shape"
          $server = Start-Process python -ArgumentList @("-m", "http.server", "8765", "--bind", "127.0.0.1", "--directory", $release) -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 2
            $env:PLAYWORK_WINDOWS_X64_ZIP_URL = "http://127.0.0.1:8765/playwork-windows-x64.zip"
            $env:PLAYWORK_PORTABLE_GIT_URL = "http://127.0.0.1:8765/PortableGit-2.54.0-64-bit.7z.exe"
            $env:PLAYWORK_INSTALL_DIR = $install
            $env:PLAYWORK_ADD_TO_PATH = "0"
            & (Join-Path $release "install.ps1")
            if ($LASTEXITCODE -ne 0) { throw "Installer failed: $LASTEXITCODE" }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
          $version = & (Join-Path $install "playwork.cmd") --version
          if ($LASTEXITCODE -ne 0 -or $version.Trim() -ne "0.0.15") { throw "Version proof failed: $version" }
          $help = (& (Join-Path $install "playwork.cmd") --help) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "Help proof failed: $LASTEXITCODE" }
          if ($help -notmatch "playwork auth login" -or $help -notmatch "/export \[path\]") { throw "Customer help contract missing" }
          if ($help -match "/share|/login|--provider|--api-key|codex|openai|hosted|runtime profile") { throw "Customer help exposes forbidden implementation language" }
          $report = Get-Content (Join-Path $install "BINARY-STAGING-REPORT.json") -Raw | ConvertFrom-Json
          if ($report.profile -ne "customer-playwork-account" -or $report.runtimeProfile -ne "playwork-hosted" -or $report.appAttach -ne "auto") { throw "Installed profile contract failed" }
          "version=$version profile=$($report.profile) runtimeProfile=$($report.runtimeProfile) appAttach=$($report.appAttach)" | Set-Content windows-fresh-install-proof.txt

      - name: Capture provenance and hashes
        working-directory: source/runtime/playwork
        run: |
          "88f55d1e227f72b83773c8c4e807808e7c51c6b6" | Set-Content packages/computer-agent/binaries/windows-x64-release/SOURCE-COMMIT.txt
          Get-Content packages/computer-agent/binaries/windows-x64/BINARY-STAGING-REPORT.json
          Get-Content packages/computer-agent/binaries/windows-x64-release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: playwork-windows-x64-0.0.15-88f55d1e
          path: |
            source/runtime/playwork/packages/computer-agent/binaries/windows-x64-release
            source/runtime/playwork/runtime-functional-smoke-windows-x64.json
            source/runtime/playwork/windows-fresh-install-proof.txt
          if-no-files-found: error
          retention-days: 1
